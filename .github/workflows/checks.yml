name: Checks

# Runs every *-check.cjs against a test server (sync off, empty data folder) in Chrome. The private place catalog is not
# in the repository, so the checks that need it print SKIP and are not counted as failures.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      only:
        description: "Only these checks, space separated (for example: ui address). Empty runs all."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]   # three machines each run a third of the checks, so the map-heavy ones are not starved of CPU
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"   # the runner already has Google Chrome, which the checks drive
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm install --no-save playwright
      - run: npm run check
      - run: node run-checks.cjs --shard ${{ matrix.shard }}/3 ${{ inputs.only }}

      - name: Preserve check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs-${{ matrix.shard }}
          path: |
            output/playwright/*.log
            output/playwright/results*.json
          retention-days: 7
          if-no-files-found: ignore
