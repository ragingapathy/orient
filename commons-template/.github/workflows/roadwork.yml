name: Road work

# Every half hour, read the road-work feeds in roadwork.config.json (WZDx, the US standard) and publish one small file:
#   https://raw.githubusercontent.com/<owner>/<repo>/roadwork-data/roadwork.json
# It goes on its own branch as a single commit that is replaced each time, so the repository's history does not grow.
# API keys live in Settings > Secrets and variables > Actions (OHGO_API_KEY for Ohio). Nothing here runs for pull requests.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: roadwork
  cancel-in-progress: true

jobs:
  roadwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Fetch the last published file (to keep it if a feed fails)
        run: |
          git fetch --depth=1 origin roadwork-data || true
          git show FETCH_HEAD:roadwork.json > previous.json 2>/dev/null || rm -f previous.json

      - name: Fetch and normalise the feeds
        run: node tools/fetch-roadwork.cjs --previous previous.json --out roadwork.json
        env:
          OHGO_API_KEY: ${{ secrets.OHGO_API_KEY }}

      - name: Publish
        run: |
          set -e
          mkdir publish && cp roadwork.json publish/
          cd publish
          git init -q -b roadwork-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add roadwork.json
          git commit -q -m "Road work, $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" roadwork-data
