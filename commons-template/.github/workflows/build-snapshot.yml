name: Build snapshot

# When a contribution is merged, rebuild snapshot.json so people can follow one address:
#   https://raw.githubusercontent.com/<owner>/<repo>/main/snapshot.json
on:
  push:
    branches: [main]
    paths:
      - 'contributions/**'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-snapshot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build orders contributions by when they were merged

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        run: node tools/build-snapshot.cjs

      - name: Commit the snapshot if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The snapshot is already up to date."
          else
            git commit -m "Rebuild snapshot"
            git push
          fi
